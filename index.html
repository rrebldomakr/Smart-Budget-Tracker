<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Budget Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-container">
        <h2>💰 Smart Budget Tracker</h2>

        <div class="glass-card">
            <label>Monthly Budget Limit ($)</label>
            <input type="number" id="budget-limit" value="1000" oninput="updateUI()">
        </div>

        <div class="stats-grid">
            <div class="stat-item">
                <span id="total-spent">$0</span>
                <p>Total Spent</p>
            </div>
            <div class="stat-item">
                <span id="remaining-budget">$0</span>
                <p>Remaining</p>
            </div>
        </div>

        <div class="input-panel">
            <input type="text" id="exp-desc" placeholder="Expense Description (e.g. Pizza)">
            <input type="number" id="exp-amount" placeholder="Amount ($)">
            <select id="exp-category">
                <option value="Necessity">🏠 Necessity</option>
                <option value="Food">🍎 Food</option>
                <option value="Fun">🎸 Fun</option>
            </select>
            <button onclick="addExpense()">Log Expense</button>
        </div>

        <ul id="expense-list"></ul>
    </div>

    <script src="app.js"></script>
</body>
</html>
